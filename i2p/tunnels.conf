# server tunnels exposing the static site into I2P
# https://docs.i2pd.website/en/latest/user-guide/tunnels/
[avkean]
type = http
host = web
port = 80
# vanity keypair, mounted from i2p/keys (server-side only)
keys = keys/avkean-i2p-keys.dat
signaturetype = 7
# host location is public (clearnet mirror), so short tunnels for speed
inbound.length = 1
outbound.length = 1
inbound.quantity = 5
outbound.quantity = 5
# ECIES-X25519 leasesets only
i2cp.leaseSetEncType = 4
# don't pass visitor X-I2P-* headers to the web server
i2pheaders = false

# stats.i2p never allows changing a registered destination, so avkean.i2p there
# is bound to this older key forever; keep it served so those users land here too
[avkean-statsi2p]
type = http
host = web
port = 80
keys = keys/avkean-i2p-keys-old2.dat
signaturetype = 7
inbound.length = 1
outbound.length = 1
inbound.quantity = 5
outbound.quantity = 5
i2cp.leaseSetEncType = 4
i2pheaders = false
