# i2pd router config for the eepsite sidecar
# https://docs.i2pd.website/en/latest/user-guide/configuration/
log = stdout
loglevel = warn

ipv4 = true
ipv6 = true
nat = false
# NTCP2 (tcp) + SSU2 (udp) listen port; published in docker-compose
port = 24688

# no transit relaying: bandwidth on this box is metered
notransit = true
bandwidth = O

[ntcp2]
enabled = true
published = true

[ssu2]
enabled = true
published = true

[upnp]
enabled = false

# router console, loopback only; peek with:
#   docker exec avkean-i2pd wget -qO- http://127.0.0.1:7070/
[http]
enabled = true
address = 127.0.0.1
port = 7070

# client-side services, all unused here
[httpproxy]
enabled = false

[socksproxy]
enabled = false

[sam]
enabled = false

[bob]
enabled = false

[i2cp]
enabled = false
