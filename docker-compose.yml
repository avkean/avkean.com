services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avkean-web
    restart: unless-stopped
    networks:
      - proxy_net
      - default

  i2pd:
    image: purplei2p/i2pd:latest-release
    container_name: avkean-i2pd
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - ./i2p/i2pd.conf:/home/i2pd/data/i2pd.conf:ro
      - ./i2p/tunnels.conf:/home/i2pd/data/tunnels.conf:ro
      # eepsite keypairs live on the server only, never in git
      - ./i2p/keys:/home/i2pd/data/keys:ro
      - i2pd_data:/home/i2pd/data
    ports:
      # NTCP2/SSU2 so the router is reachable, not firewalled
      - "24688:24688/tcp"
      - "24688:24688/udp"
    networks:
      - default

  tor:
    build:
      context: ./tor
      dockerfile: Dockerfile
    container_name: avkean-tor
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      # hidden service keypair lives on the server only, never in git
      - ./tor/keys:/keys:ro
    networks:
      - default

networks:
  proxy_net:
    external: true

volumes:
  i2pd_data:
